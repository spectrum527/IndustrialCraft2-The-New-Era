pluginManagement {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        gradlePluginPortal()
    }
    plugins { id 'net.minecraftforge.gradle' version '6.0.54' }
}
rootProject.name = 'industrialcraft-2'
include 'common', 'forge:1.19.2', 'test'
project(':common').projectDir = file('src/common')
project(':forge').projectDir = file('src/forge')
project(':forge:1.19.2').projectDir = file('src/forge/1.19.2')
project(':test').projectDir = file('src/test')
