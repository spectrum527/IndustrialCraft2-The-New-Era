pluginManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
    plugins { id 'net.neoforged.moddev' version providers.gradleProperty('moddev_version').get() }
}
rootProject.name = 'industrialcraft-2'
def minecraftTargets = ['1.21.1', '26.1.2', '26.2']
include 'common', 'datagen', 'test'
minecraftTargets.each { include "neoforge:$it" }
['common', 'neoforge', 'datagen', 'test'].each { project(":$it").projectDir = file("src/$it") }
minecraftTargets.each { project(":neoforge:$it").projectDir = file("src/neoforge/$it") }
