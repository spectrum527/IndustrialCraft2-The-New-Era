pluginManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net' }
        gradlePluginPortal()
    }
    plugins {
        id 'net.neoforged.moddev' version providers.gradleProperty('moddev_version').get()
        id 'net.neoforged.moddev.legacyforge' version providers.gradleProperty('moddev_version').get()
    }
}
rootProject.name = 'industrialcraft-2'
def minecraftTargets = ['1.21.1', '26.1.2', '26.2']
include 'common', 'datagen', 'test', 'forge:1.19.2'
minecraftTargets.each { include "neoforge:$it" }
['common', 'neoforge', 'forge', 'datagen', 'test'].each { project(":$it").projectDir = file("src/$it") }
minecraftTargets.each { project(":neoforge:$it").projectDir = file("src/neoforge/$it") }
project(':forge:1.19.2').projectDir = file('src/forge/1.19.2')
