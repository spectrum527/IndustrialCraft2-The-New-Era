name: Build
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ['1.21.1', '26.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Verify wrapper checksum
        run: sha256sum -c gradle/wrapper/gradle-wrapper.jar.sha256
      - uses: gradle/actions/setup-gradle@v4
      - name: Build target and verify JAR contract
        run: ./gradlew :neoforge:${{ matrix.target }}:build :test:test -Pia2.testTarget=${{ matrix.target }} check
      - name: Resource overlay regression
        if: matrix.target == '1.21.1'
        run: python3 src/test/resource_overlay.py
      - name: Similarity tool tests
        run: python3 -m unittest discover -s tools/similarity -p 'test_*.py'
      - name: Similarity gate without private comparison input
        shell: bash
        run: |
          set +e
          python3 tools/similarity/check.py --candidate src > similarity.json
          result=$?
          set -e
          cat similarity.json
          if [ "$result" -eq 3 ]; then
            echo '::warning::Similarity gate skipped: private comparison input is absent; full gate was NOT evaluated.'
          else
            exit "$result"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.target }}
          path: |
            similarity.json
            src/test/build/reports/tests/
            src/neoforge/${{ matrix.target }}/build/libs/
