name: Forge 1.19.2

on:
  push:
    branches: ['1.19.2']
  pull_request:
    branches: ['1.19.2']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Gradle wrapper
        run: sha256sum -c gradle/wrapper/gradle-wrapper.jar.sha256
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the production JAR and run common contracts
        run: ./gradlew build --console=plain
      - name: Run required Forge GameTest
        run: python3 src/forge/1.19.2/qa/verify.py smoke --output build/evidence-smoke
      - name: Reopen the same Forge world in another server JVM
        run: python3 src/forge/1.19.2/qa/verify.py world --output build/evidence-world
      - name: Check the matching and mismatching clients
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a python3 src/forge/1.19.2/qa/verify.py play --output build/evidence-play
          xvfb-run -a python3 src/forge/1.19.2/qa/verify.py mismatch --output build/evidence-mismatch --prepared
      - name: Test the similarity checker
        run: python3 -m unittest discover -s tools/similarity -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-1.19.2-verification
          path: |
            src/forge/1.19.2/build/libs/*.jar
            src/test/build/test-results/test/TEST-*.xml
            build/evidence-*/**/result.json
            build/evidence-*/**/*.properties
            build/evidence-*/**/game-test.xml
            build/evidence-*/**/lifecycle-*.txt
            build/evidence-*/**/config-*.txt
            build/evidence-*/**/capability-*.txt
            build/evidence-*/**/process-exits.json
            build/evidence-*/**/*.log
            build/evidence-*/**/*checks*.json
