plugins {
    id 'base'
    id 'com.diffplug.spotless' version '6.25.0'
}
allprojects {
    group = 'com.industrialage.ia2'
    version = rootProject.property('mod_version')
    repositories { mavenCentral() }
}
subprojects {
    plugins.withId('java') {
        java.toolchain.languageVersion = JavaLanguageVersion.of(17)
        tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
        tasks.withType(AbstractArchiveTask).configureEach {
            preserveFileTimestamps = false
            reproducibleFileOrder = true
        }
    }
}
spotless {
    java {
        target 'src/common/src/**/*.java', 'src/forge/**/*.java', 'src/test/src/test/**/*.java',
                'src/neoforge/shared/src/main/java/com/industrialage/ia2/platform/NeoForgeEvents.java',
                'src/neoforge/shared/src/main/java/com/industrialage/ia2/platform/NeoForgeConfig.java'
        targetExclude '**/build/**'
        googleJavaFormat('1.22.0').aosp()
    }
}
apply from: 'gradle/checks.gradle'
tasks.named('build') { dependsOn ':forge:1.19.2:build', ':test:test' }
