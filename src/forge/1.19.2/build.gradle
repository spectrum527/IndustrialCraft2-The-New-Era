import net.minecraftforge.artifactural.api.artifact.Artifact
import net.minecraftforge.artifactural.api.artifact.ArtifactType
import net.minecraftforge.artifactural.api.repository.ArtifactProvider
import net.minecraftforge.artifactural.base.artifact.StreamableArtifact
import net.minecraftforge.artifactural.gradle.GradleRepositoryAdapter
import net.minecraftforge.gradle.common.util.Artifact as ForgeArtifact
import net.minecraftforge.gradle.common.util.BaseRepo

plugins {
    id 'java'
    id 'net.minecraftforge.gradle'
}
base.archivesName = "ic2-forge-${minecraft_version}"
sourceSets {
    main {
        java.srcDir rootProject.file('src/common/src/main/java')
    }
    qa {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory providers.gradleProperty('qaDir').map { file(it) }
                    .getOrElse(layout.buildDirectory.dir("run/$name").get().asFile)
            property 'forge.logging.console.level', 'info'
            mods { ic2 { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {}
        // ForgeGradle merges profiles by name, so a derived run must sort after its parent.
        serverQaWorld {
            taskName "runQaWorld"
            parent runs.server
            property 'ic2.qa.worldPhase', providers.gradleProperty('qaPhase').getOrElse('write')
        }
        serverQaPlay {
            taskName "runQaPlayServer"
            parent runs.server
            property 'ic2.qa.clientAcceptance', 'true'
        }
        qaPlayClient {
            parent runs.client
            property 'ic2.qa.clientAcceptance', 'true'
            property 'ic2.qa.clientPort', providers.gradleProperty('qaPort').getOrElse('25565')
            args '--username', 'P2Tester'
        }
        qaGameTestServer {
            parent runs.gameTestServer
            property 'forge.enabledGameTestNamespaces', 'ic2_qa'
        }
        matching { it.name.startsWith('qa') || it.name.startsWith('serverQa') }.all {
            mods { ic2_qa { source sourceSets.qa } }
        }
    }
}
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }

tasks.named('processResources') {
    inputs.properties(version: project.version, minecraftVersion: minecraft_version, forgeVersion: forge_version)
    filesMatching('META-INF/mods.toml') {
        expand version: project.version, minecraftVersion: minecraft_version, forgeVersion: forge_version
    }
    from(rootProject.file('spec/config/active-keys.tsv')) { into 'com/industrialage/ia2/config' }
    from(rootProject.file('assets')) {
        into 'assets'
        exclude '**/*.md', '**/.git*', '**/.DS_Store'
        includeEmptyDirs = false
    }
}
tasks.named('jar') {
    from rootProject.files('LICENSE', 'COPYING', 'LICENSE-ASSETS')
    finalizedBy 'reobfJar'
}

apply from: 'qa/play.gradle'
apply from: 'qa/machine.gradle'

apply from: rootProject.file('gradle/canonical-forge-jar.gradle')
// Serve only this derived coordinate through the canonical publisher. ForgeGradle still generates
// its artifacts, and Gradle verifies the POM, published JAR and other dependencies normally.
repositories {
    String mapped = "${minecraft_version}-${forge_version}_mapped_official_${minecraft_version}"
    def normalize = canonicalForgeJar(mapped)
    def checksums = [md5: 'MD5', sha1: 'SHA-1', sha256: 'SHA-256', sha512: 'SHA-512']
    GradleRepositoryAdapter stable
    def provide = { id ->
        if (id.group != 'net.minecraftforge' || id.name != 'forge' || id.version != mapped) return Artifact.none()
        String checksumAlgorithm = !id.classifier && id.extension.startsWith('jar.') ? checksums[id.extension.substring(4)] : null
        def primary = checksumAlgorithm ? ForgeArtifact.from(id.group, id.name, mapped, null, 'jar') : id
        File file = project.repositories.withType(GradleRepositoryAdapter).findAll { it != stable }
                .findResult { generator -> generator.getArtifact(primary) }
        if (file == null) return Artifact.none()
        if (!primary.classifier && primary.extension == 'jar') file = normalize(file)
        if (checksumAlgorithm) return StreamableArtifact.ofBytes(id, ArtifactType.OTHER, forgeJarChecksum(file, checksumAlgorithm))
        def type = id.classifier == 'sources' ? ArtifactType.SOURCE :
                (id.extension == 'jar' ? ArtifactType.BINARY : ArtifactType.OTHER)
        return StreamableArtifact.ofFile(id, type, file)
    } as ArtifactProvider
    stable = new BaseRepo.Builder().add(provide).attach(project, 'ic2-canonical-mapped-repo')
    exclusiveContent {
        forRepositories(stable)
        filter { includeVersion('net.minecraftforge', 'forge', mapped) }
    }
}
