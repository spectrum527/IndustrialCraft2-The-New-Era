plugins { id 'java-library' }

tasks.named('processResources') {
    from(rootProject.file('spec/registry')) {
        include 'industrial-materials.tsv', 'processing-recipes.tsv', 'processing-tags.tsv', 'workshop-recipes.tsv', 'industrial-fluids.tsv'
        into 'com/industrialage/ia2/content'
    }
    from(rootProject.file('spec/config/active-keys.tsv')) {
        into 'com/industrialage/ia2/config'
    }
}
