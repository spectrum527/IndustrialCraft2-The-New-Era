import groovy.xml.XmlSlurper

plugins { id 'java-library' }
dependencies {
    testImplementation project(':common')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}
def platformProjects = rootProject.project(':neoforge').childProjects
def requestedTarget = providers.gradleProperty('ic2.testTarget')
        .orElse(providers.gradleProperty('ia2.testTarget'))
def targets = requestedTarget.isPresent() ? [requestedTarget.get()] :
        platformProjects.values().findAll { it.buildFile.isFile() }.collect { it.name }.sort()
if (targets.isEmpty() || targets.any { !platformProjects.containsKey(it) }) {
    throw new GradleException("Unknown or empty NeoForge test targets: ${targets}")
}
def junit = tasks.named('test', Test) {
    useJUnitPlatform()
    outputs.upToDateWhen { false }
    outputs.doNotCacheIf('JUnit evidence must come from the current run') { true }
    doFirst {
        delete reports.junitXml.outputLocation
        systemProperty 'ia2.targets', targets.join(',')
        targets.each { target ->
            def platform = platformProjects[target]
            systemProperty "ia2.target.${target}.jar", platform.tasks.named('jar').get()
                    .archiveFile.get().asFile.absolutePath
            systemProperty "ia2.target.${target}.neoForgeVersion", platform.ext.neoForgeVersion
        }
    }
    finalizedBy 'requireJUnitExecution'
    dependsOn targets.collect { ":neoforge:$it:verifyDevelopmentJar" }
    systemProperty 'ia2.testClassesDirs', testClassesDirs.asPath
    systemProperty 'ic2.activeKeysTable', rootProject.file('spec/config/active-keys.tsv').absolutePath
    systemProperty 'ic2.modVersion', rootProject.version.toString()
    systemProperty 'ic2.notice', rootProject.file('NOTICE.md').absolutePath
}
def advancementResources = tasks.register('verifyAdvancementResources', Exec) {
    group = 'verification'
    description = 'Checks shipped progression criteria, rewards, and bilingual text against the gameplay contract.'
    dependsOn targets.collect { ":neoforge:$it:verifyDevelopmentJar" }
    doFirst {
        commandLine 'python3', rootProject.file('src/test/verify_gameplay_advancements.py'),
                *targets.collect { target ->
                    def jar = platformProjects[target].tasks.named('jar').get().archiveFile.get().asFile
                    "${target}=${jar.absolutePath}"
                }
    }
}
junit.configure { dependsOn advancementResources }
tasks.register('requireJUnitExecution') {
    doLast {
        def testTask = junit.get()
        def reports = fileTree(testTask.reports.junitXml.outputLocation) { include 'TEST-*.xml' }
        if (!testTask.state.didWork || !reports.any { file ->
            def suite = new XmlSlurper().parse(file)
            suite.@tests.toInteger() > suite.@skipped.toInteger()
        }) {
            throw new GradleException('No JUnit cases executed.')
        }
    }
}
tasks.register('runGameTest') {
    group = 'verification'
    description = 'Runs the 1.21.1 development GameTest server.'
    dependsOn ':neoforge:1.21.1:runGameTest'
}
tasks.register('runPlatformWorldTest') {
    group = 'verification'
    description = 'Verifies platform services across two 1.21.1 dedicated server processes.'
    dependsOn ':neoforge:1.21.1:runPlatformRead'
}
tasks.register('runPlatformHostTest') {
    group = 'verification'
    dependsOn ':neoforge:1.21.1:platformHostTest'
}
